[project]
name = "aifirm"
version = "0.1.0"
description = "A research-grade multi-agent AI investment firm: verified data desk, independent analyst agents, adversarial review, deterministic portfolio construction and risk, decision journal with calibration scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.9",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "requests>=2.31",
  "yfinance>=0.2.50",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aifirm = "aifirm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aifirm*"]

# Bundled universe lists (aifirm/universes/*.txt) ship with the package.
[tool.setuptools.package-data]
"aifirm.universes" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
